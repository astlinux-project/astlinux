name: Send Email on Push

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
      - uses: taiki-e/checkout-action@v1
      - name: Set variables
        run: |
          echo "TITLE=$(echo '${{ github.event.head_commit.message }}' | head -n 1)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-6)" >> $GITHUB_ENV
          echo "CHANGED_PATHS=$(git show --name-status --pretty='format:' '${{ github.sha }}')" >> $GITHUB_ENV
      - name: Send mail
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[${{ github.repository }}] ${{ env.SHORT_SHA }}: ${{ env.TITLE }}"
          body: |
            Home: ${{ github.server_url }}/${{ github.repository }}

            Commit URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Commit SHA: ${{ github.sha }}

            Author: ${{ github.actor }}

            Changed paths:
            ${{ env.CHANGED_PATHS }}

            Log Message:
            -----------
            ${{ github.event.head_commit.message }}
          to: astlinux-notify@astlinux-project.com
          from: noreply@astlinux-project.com
