name: Send Email on Push

on:
  push:
    branches: [ master ]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "TITLE=$(echo '${{ github.event.head_commit.message }}' | head -n 1)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-6)" >> $GITHUB_ENV
      - name: Send mail
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[${{ github.repository }}] ${{ env.SHORT_SHA }}: ${{ env.TITLE }}"
          body: |
            Home: ${{ github.server_url }}/${{ github.repository }}
            Commit URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Commit SHA: ${{ github.sha }}
            Author: ${{ github.actor }}

            Log Message:
            -----------
            ${{ github.event.head_commit.message }}
          #to: astlinux-notify@astlinux-project.com
          to: lonnie@abelbeck.com
          from: noreply@astlinux-project.com
