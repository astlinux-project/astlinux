name: Send Email on Push

on:
  push:
    branches: [ master ]

jobs:
  get-commit-title:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get.outputs.title }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        run: echo "title=$(git log -1 --pretty=format:'%s')" >> "$GITHUB_OUTPUT"

  send-email:
    runs-on: ubuntu-latest
    steps:
      - run: echo "TITLE=$(echo '${{ github.event.head_commit.message }}' | head -n 1)" >> $GITHUB_ENV
      - name: Send mail
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[${{ github.repository }}] ${{ env.TITLE }}"
          body: |
            Commit URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}
          #to: astlinux-notify@astlinux-project.com
          to: lonnie@abelbeck.com
          from: noreply@astlinux-project.com
